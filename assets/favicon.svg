<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C55E7B"/>
      <stop offset="100%" stop-color="#9E3B56"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9E3B56" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#roseGrad)" filter="url(#shadow)"/>
  <!-- Decorative AI node dot -->
  <circle cx="48" cy="16" r="3.5" fill="#FFE5EC" opacity="0.9"/>
  <line x1="48" y1="16" x2="42" y2="22" stroke="#FFE5EC" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7"/>
  <!-- Monogram Initials "KSK" -->
  <text x="32" y="39" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="19" 
        font-weight="800" 
        letter-spacing="0.5"
        fill="#FFFFFF" 
        text-anchor="middle">KSK</text>
  <!-- Subtle baseline indicator -->
  <rect x="22" y="45" width="20" height="2" rx="1" fill="#FFE5EC" opacity="0.8"/>
</svg>
